<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ドイツ語クイズ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ヘッダー -->
    <header class="header">
        <h1>🇩🇪 ドイツ語クイズ</h1>
    </header>


    <!-- 問題データ読み込みエリア -->
    <section class="card">

        <h2>問題データ入力</h2>

        <textarea 
            id="questionInput"
            placeholder="問題データをここに貼り付けてください">
        </textarea>

        <button id="loadButton">
            読み込み
        </button>


        <p>
            読み込み件数：
            <span id="questionCount">0</span>問
        </p>

    </section>



    <!-- 出題設定 -->
    <section class="card settings">

        <label>
            <input 
                type="checkbox" 
                id="randomMode">
            ランダム出題
        </label>

    </section>



    <!-- クイズ表示エリア -->
    <section class="card quiz">


        <div class="question-info">

            <span id="questionNumber">
                問題 0 / 0
            </span>

            <span id="questionLevel">
                
            </span>

        </div>



        <div id="questionArea">

            <h2 id="questionText">
                問題文
            </h2>


            <!-- 問題形式ごとの表示場所 -->
            <div id="answerArea">

            </div>


            <!-- 採点結果 -->
            <div id="feedbackArea">

            </div>


            <!-- 解説 -->
            <div id="explanationArea">

            </div>

        </div>


    </section>



    <!-- 操作ボタン -->
    <section class="navigation">

        <button id="previousButton">
            ← 前の問題
        </button>


        <button id="nextButton">
            次の問題 →
        </button>

    </section>



    <!-- 成績表示 -->
    <section class="card result-summary">

        <h2>成績</h2>

        <p>
            正答数：
            <span id="correctCount">
                0
            </span>
        </p>


        <p>
            正答率：
            <span id="accuracy">
                0%
            </span>
        </p>


        <button id="resultButton">
            結果を見る
        </button>

    </section>



    <!-- 最終結果画面 -->
    <section 
        class="card hidden" 
        id="resultArea">

        <h2>
            結果
        </h2>


        <p id="finalResult">

        </p>

    </section>


</div>


<script src="script.js"></script>

</body>
</html>
